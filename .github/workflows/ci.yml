name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings
  CARGO_HACK_VERSION: 0.6.46
  CARGO_DENY_VERSION: 0.20.2
  CARGO_VET_VERSION: 0.10.3
  CARGO_FUZZ_VERSION: 0.13.2
  FUZZ_TOOLCHAIN: nightly-2026-11-01
  TAPLO_VERSION: 0.10.0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check

  taplo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked taplo-cli --version "$TAPLO_VERSION"
      - run: taplo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo clippy --workspace --all-targets --all-features --locked

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p sigroot-hd --features bip32,bip39 --locked
      - run: cargo test -p sigroot-eth --features address,pubkey,verify,keys,hd,mnemonic,eip191,tx-legacy,tx-eip2930,tx-eip1559,erc20,policy,unchecked-prehash --locked
      - run: cargo run -p sigroot-eth --example offline_signer --features mnemonic,tx-eip1559,policy,verify --locked
      - run: cargo doc --workspace --all-features --no-deps --locked

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-hack --version "$CARGO_HACK_VERSION"
      - run: cargo hack clippy --workspace --exclude sigroot-nostd-check --each-feature --locked
      - run: cargo hack check --workspace --exclude sigroot-nostd-check --feature-powerset --depth 2 --locked

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup component add llvm-tools-preview
      - run: cargo install --locked cargo-hack --version "$CARGO_HACK_VERSION"
      - run: cargo hack check --workspace --exclude sigroot-nostd-check --each-feature --exclude-features std --target thumbv7em-none-eabihf --locked
      - run: bash tools/nostd-check/check-sizes.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - run: cargo +"$FUZZ_TOOLCHAIN" metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - run: cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
      - run: |
          for target in tx access_list erc20 text; do
            mkdir -p "fuzz/corpus/$target"
            cargo +"$FUZZ_TOOLCHAIN" fuzz run "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- -max_total_time=30
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: echo "MSRV=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$MSRV" --profile minimal
      - run: cargo +"$MSRV" check --workspace --all-features --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - run: cargo deny --locked check
      - run: cargo deny --manifest-path fuzz/Cargo.toml --locked check --config deny.toml

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo install --locked cargo-vet --version "$CARGO_VET_VERSION"
      - run: cargo vet --locked
      - run: |
          store="$RUNNER_TEMP/supply-chain"
          cp -R supply-chain "$store"
          awk '/^\[\[exemptions\./ && !p { print "[policy.sigroot-fuzz]\ncriteria = \"safe-to-run\"\n"; p = 1 } 1' supply-chain/config.toml > "$store/config.toml"
          cargo vet --manifest-path fuzz/Cargo.toml --store-path "$store" --locked
