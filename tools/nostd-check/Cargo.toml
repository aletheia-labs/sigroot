[package]
name = "sigroot-nostd-check"
description = "Links sigroot into a bare-metal binary without a global allocator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sigroot-core.workspace = true
sigroot-eth = { workspace = true, features = [
	"address",
	"pubkey",
	"verify",
	"keys",
	"hd",
	"mnemonic",
	"eip191",
	"tx-legacy",
	"tx-eip2930",
	"tx-eip1559",
	"erc20",
	"policy",
	"unchecked-prehash",
] }
