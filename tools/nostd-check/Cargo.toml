[package]
name = "sigroot-nostd-check"
description = "Links sigroot into a bare-metal binary without a global allocator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sigroot-core.workspace = true
sigroot-eth = { workspace = true }

[features]
default = ["full"]
# Size profiles built one at a time (`--no-default-features --features <name>`).
address = ["sigroot-eth/address"]
offline = [
	"sigroot-eth/mnemonic",
	"sigroot-eth/tx-eip1559",
	"sigroot-eth/policy",
	"sigroot-eth/verify",
]
full = [
	"sigroot-eth/address",
	"sigroot-eth/pubkey",
	"sigroot-eth/verify",
	"sigroot-eth/keys",
	"sigroot-eth/hd",
	"sigroot-eth/mnemonic",
	"sigroot-eth/eip191",
	"sigroot-eth/tx-legacy",
	"sigroot-eth/tx-eip2930",
	"sigroot-eth/tx-eip1559",
	"sigroot-eth/erc20",
	"sigroot-eth/policy",
	"sigroot-eth/unchecked-prehash",
]
