[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT"]
confidence-threshold = 0.95
exceptions = [
	{ crate = "subtle", allow = [
		"BSD-3-Clause",
	] },
	{ crate = "unicode-normalization", allow = [
		"Unicode-3.0",
	] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
